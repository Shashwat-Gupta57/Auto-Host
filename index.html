<!DOCTYPE html>
<html>
<head>
  <title>Create Proposal</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input, textarea { width: 400px; padding: 10px; margin: 10px; }
    textarea { height: 100px; }
    button { padding: 10px 20px; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Create Your Proposal Site</h2>

  <div>
    <input type="text" id="yourName" placeholder="Your Name (e.g. Aryan)" /><br>
    <input type="text" id="herName" placeholder="Her Name (e.g. Neha)" /><br>
    <textarea id="appreciation" placeholder="Write appreciation paragraph..."></textarea><br>
    <textarea id="confession" placeholder="Write your confession letter..."></textarea><br>

    <label>
      <input type="checkbox" id="useDefault"> Use default template values
    </label><br>

    <button id="hostBtn">Host My Site</button>
  </div>

  <div id="result"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBIyIXYNvVhJnSK58rB29K9n7SNnbaoqnc",
      authDomain: "proposal-apoorva-sarvagy.firebaseapp.com",
      databaseURL: "https://proposal-apoorva-sarvagy-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "proposal-apoorva-sarvagy",
      storageBucket: "proposal-apoorva-sarvagy.firebasestorage.app",
      messagingSenderId: "794226715688",
      appId: "1:794226715688:web:284222db7af709b2cd591d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function generateToken() {
      const time = Date.now().toString(36);
      const random = crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
      return time + random;
    }

    document.getElementById("hostBtn").addEventListener("click", async () => {

      const useDefault = document.getElementById("useDefault").checked;

      let data;

      if (useDefault) {
        data = {
          yourName: "Aryan",
          herName: "Neha",
          appreciation: "You are my safe space and the light in my life.",
          confession: "Over time, my admiration for you has grown into something deeper..."
        };
      } else {
        data = {
          yourName: document.getElementById("yourName").value,
          herName: document.getElementById("herName").value,
          appreciation: document.getElementById("appreciation").value,
          confession: document.getElementById("confession").value
        };
      }

      const token = generateToken();

      await db.ref("Auto-Host/" + token).set({
        ...data,
        createdAt: Date.now()
      });

      const link = `${window.location.origin}/auto-host/hosted.html?token=${token}`;

      document.getElementById("result").innerHTML =
        `<p>Site Created:</p><a href="${link}" target="_blank">${link}</a>`;
    });
  </script>

</body>
</html>
