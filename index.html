<!DOCTYPE html>
<html>
<head>
  <title>Auto Host</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 100px; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px 20px; margin-top: 20px; display: none; }
    #linkBox { margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Create Your Custom Site</h2>
  <input type="text" id="userText" placeholder="Enter your text..." />
  <br>
  <button id="hostBtn">Host</button>

  <div id="linkBox"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBIyIXYNvVhJnSK58rB29K9n7SNnbaoqnc",
      authDomain: "proposal-apoorva-sarvagy.firebaseapp.com",
      databaseURL: "https://proposal-apoorva-sarvagy-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "proposal-apoorva-sarvagy",
      storageBucket: "proposal-apoorva-sarvagy.firebasestorage.app",
      messagingSenderId: "794226715688",
      appId: "1:794226715688:web:284222db7af709b2cd591d",
      measurementId: "G-BZ4R12MR9T"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const input = document.getElementById("userText");
    const hostBtn = document.getElementById("hostBtn");
    const linkBox = document.getElementById("linkBox");

    input.addEventListener("input", () => {
      hostBtn.style.display = input.value.trim() ? "inline-block" : "none";
    });

    function generateToken() {
      const time = Date.now().toString(36);
      const random = crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
      return time + random;
    }

    async function createUniqueToken() {
      let token;
      let exists = true;

      while (exists) {
        token = generateToken();
        const snap = await db.ref("Auto-Host/" + token).once("value");
        exists = snap.exists();
      }
      return token;
    }

    hostBtn.addEventListener("click", async () => {
      const text = input.value.trim();
      if (!text) return;

      const token = await createUniqueToken();

      await db.ref("Auto-Host/" + token).set({
        token: token,
        text: text,
        createdAt: Date.now()
      });

      const link = `${window.location.origin}/auto-host/hosted.html?token=${token}`;

      linkBox.innerHTML = `
        <p>Your site is ready:</p>
        <a href="${link}" target="_blank">${link}</a>
      `;

      input.value = "";
      hostBtn.style.display = "none";
    });
  </script>

</body>
</html>
